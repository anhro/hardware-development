# Залежності скетча (arduino-cli build profile): плата, ядро та бібліотеки з
# точними версіями. Бібліотеки в git не зберігаються — arduino-cli завантажує
# їх сам під час `make firmware PROJECT=stepper-motor`.
default_profile: esp32
default_fqbn: esp32:esp32:esp32

profiles:
  esp32:
    notes: ESP32-DevKitC-32E
    fqbn: esp32:esp32:esp32
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    libraries:
      - AccelStepper (1.64)
